services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mysql

volumes:
  mysql_data: